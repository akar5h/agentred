name: jakk release

# Builds, tests, and validates the jakk package on a jakk-v* tag, then
# attaches the sdist + wheel + checksums to the GitHub Release.
#
# PyPI publishing is intentionally NOT wired up here yet — it requires a
# PyPI "Trusted Publisher" to be configured on the PyPI side (Settings →
# Publishing → add this repo + workflow). Once that's done, uncomment the
# `publish-pypi` job. Until then, releases ship as GitHub Release artifacts
# with checksums.

on:
  push:
    tags:
      - "jakk-v*"

permissions:
  contents: write   # to create/update the GitHub Release

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install + test
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e "jakk[dev]"
          python -m pytest jakk/tests/unit -q

      - name: Build sdist + wheel
        run: python -m build jakk/ --outdir dist/

      - name: Validate artifacts
        run: twine check dist/*

      - name: Generate checksums
        run: |
          cd dist
          sha256sum jakk-* > CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jakk-*.whl
            dist/jakk-*.tar.gz
            dist/CHECKSUMS.txt
          body_path: jakk/CHANGELOG.md
          generate_release_notes: false

