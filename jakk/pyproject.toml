[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jakk"
version = "0.1.0"
description = "Black-box MCP server scanner — fires curated attack-class probes against an MCP endpoint and reports findings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "rich>=13.0",
]

[project.scripts]
jakk = "jakk.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jakk*"]

[tool.setuptools.package-data]
jakk = ["../library/mcp/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: integration-level tests requiring a live MCP server (docker compose).",
]
