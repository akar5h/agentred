[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grafted"
version = "0.1.0"
description = "Adaptive multi-agent red-teaming for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "langchain-anthropic>=0.3.0",
  "langchain-openai>=0.3.0",
  "deepagents>=0.4.3",
  "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["grafted*"]

[project.scripts]
grafted = "grafted.cli:main"

[project.optional-dependencies]
observability = [
  # Kairos is proprietary / not on PyPI — install editable from local checkout:
  #   pip install -e /Users/akarshgajbhiye/kairos
  # The deps below match the tau-agent pattern: Phoenix's own OTel helper
  # plus OpenInference's OpenAI auto-instrumentation. No Traceloop SaaS.
  "arize-phoenix-otel>=0.12",
  "openinference-instrumentation-openai>=0.1",
  "langfuse>=3.0",  # legacy; retire when telemetry/langfuse_exporter is removed
]
agentdojo = ["agentdojo>=0.1"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: integration-level tests",
  "e2e: end-to-end tests against a live target",
]
